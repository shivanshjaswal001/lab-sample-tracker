
<!DOCTYPE html>
<html>
<head>
    <title>Lab Sample Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Lab Sample Tracker</h1>
    <p>Team Sankalp</p>
</header>

<nav>
    <a href="#register">Register</a>
    <a href="#samples">Samples</a>
    <a href="#reports">Reports</a>
</nav>

<section id="register">
    <h2>Patient Registration</h2>
    <form id="patientForm">
        <input id="name" placeholder="Patient Name" required>
        <input id="age" type="number" min="1" max="120" placeholder="Age" required>
        <select id="test" required>
            <option value="">Select Test</option>
            <option>Blood Test</option>
            <option>Urine Test</option>
            <option>Thyroid Test</option>
        </select>
        <button>Register</button>
    </form>
</section>

<section id="samples">
    <h2>Sample Tracking</h2>
    <table>
        <tr>
            <th>ID</th><th>Patient</th><th>Test</th>
            <th>Technician</th><th>Status</th>
        </tr>
        <tbody id="sampleTable"></tbody>
    </table>

    <h3>Update Sample</h3>
    <form id="updateForm">
        <input id="sampleId" type="number" placeholder="Sample ID" required>
        <select id="technician" required>
            <option value="">Select Technician</option>
            <option>Technician A</option>
            <option>Technician B</option>
        </select>
        <select id="status" required>
            <option value="">Select Status</option>
            <option>Collected</option>
            <option>Testing</option>
            <option>Completed</option>
        </select>
        <button>Update</button>
    </form>
</section>

<section id="reports">
    <h2>Test Reports</h2>
    <form id="reportForm">
        <input id="reportId" type="number" placeholder="Sample ID" required>
        <input id="result" placeholder="Test Result" required>
        <label>
            <input type="checkbox" id="verified"> Verified
        </label>
        <button>Save Report</button>
    </form>

    <table>
        <tr>
            <th>ID</th><th>Result</th><th>Verification</th><th>Report Status</th>
        </tr>
        <tbody id="reportTable"></tbody>
    </table>
</section>

<footer>Lab Sample Tracker | Team Sankalp</footer>

<script src="script.js"></script>
</body>
</html>
